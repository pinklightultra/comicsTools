[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pencil-cleaner"
version = "0.4.9"
description = "traceJockey linework cleaner: prep comic pencils, strip pencil ghosts, score printer tests, deskew/flatten, and cut panels."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "scipy",
]

[project.optional-dependencies]
pdf = ["PyMuPDF"]
svg = ["cairosvg"]
marks = ["pypdfium2"]
web = ["gradio"]
tui = ["textual", "rich"]
gpu = ["torch"]
all = ["PyMuPDF", "cairosvg", "pypdfium2", "gradio", "textual", "rich"]

[project.scripts]
pencil-cleaner = "pencil_cleaner.cli:main"
pencil-cleaner-app = "pencil_cleaner.app:main"
tracejockey = "pencil_cleaner.cli:main"
tracejockey-tui = "pencil_cleaner.tui:main"

[tool.setuptools.packages.find]
include = ["pencil_cleaner*"]
