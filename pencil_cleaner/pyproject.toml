[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pencil-cleaner"
version = "0.4.9"
description = "Prep comic pencil scans for printing, strip pencil ghosts from inked scans, score printer tests, deskew, and cut panels."
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "opencv-python-headless",
    "Pillow",
    "scipy",
]

[project.optional-dependencies]
pdf = ["PyMuPDF"]
svg = ["cairosvg"]
marks = ["pypdfium2"]
web = ["gradio"]
tui = ["textual", "rich"]
gpu = ["torch"]
gui = ["PySide6-Essentials>=6.5", "PyMuPDF"]
all = ["PyMuPDF", "cairosvg", "pypdfium2", "gradio", "textual", "rich"]

[project.scripts]
pencil-cleaner = "pencil_cleaner.cli:main"
pencil-cleaner-app = "pencil_cleaner.app:main"
pencil-cleaner-tui = "pencil_cleaner.tui:main"
comics-tools = "pencil_cleaner.desktop_main:main"

[tool.setuptools.packages.find]
include = ["pencil_cleaner*"]
